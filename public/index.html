<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6af7'/%3E%3Cpath d='M16 6l6 10-6 10-6-10z' fill='white' opacity='.92'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fafaf9;--bg2:#f3f2f0;--bg3:#e9e7e4;--panel:#ffffff;--line:#e4e2de;
  --text:#2b2a33;--muted:#7a7885;--faint:#aaa8b3;
  --accent:#6d5ae6;--accent-soft:rgba(109,90,230,.12);--accent-text:#5a47d4;
  --hl:#fff1a8;--code-bg:#f1efec;--shadow:0 12px 40px rgba(30,25,60,.18);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style",Charter,Georgia,serif;
}
:root[data-theme=dark]{
  --bg:#17161c;--bg2:#1d1c24;--bg3:#272631;--panel:#1d1c24;--line:#2c2b36;
  --text:#dedce6;--muted:#8d8b9a;--faint:#5f5d6d;
  --accent:#9b8cff;--accent-soft:rgba(155,140,255,.15);--accent-text:#b0a5ff;
  --hl:rgba(255,214,10,.28);--code-bg:#24232d;--shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:10px;border:2px solid transparent;background-clip:content-box}
#app{display:grid;grid-template-columns:48px var(--side,270px) 1fr var(--right,0px);height:100vh}
/* ribbon */
#ribbon{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
#ribbon .sp{flex:1}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.12s}
.ib:hover{background:var(--bg3);color:var(--text)}
.ib.on{background:var(--accent-soft);color:var(--accent-text)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8b7bff,#5a47d4);display:grid;place-items:center;margin-bottom:10px}
.logo svg{stroke:#fff;fill:#fff;width:14px;height:14px;stroke-width:1}
/* sidebar */
#side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative}
.side-head{display:flex;align-items:center;gap:4px;padding:10px 10px 6px}
.side-head h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1;padding-left:4px}
.side-body{flex:1;overflow:auto;padding:4px 8px 16px}
.row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;cursor:pointer;color:var(--text);white-space:nowrap;overflow:hidden;position:relative}
.row:hover{background:var(--bg3)}
.row.on{background:var(--accent-soft);color:var(--accent-text)}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.row svg{width:15px;height:15px;color:var(--faint)}
.row.folder{font-weight:550}
.row .x{opacity:0;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.row:hover .x{opacity:1}.row .x:hover{background:var(--bg);color:#e5484d}
.row .x svg{width:13px;height:13px;color:inherit}
.chev{transition:.12s}.chev.open{transform:rotate(90deg)}
.kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}
.search-in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:0;margin:2px 0 8px}
.search-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.snip{font-size:12px;color:var(--muted);padding:0 8px 8px 29px;margin-top:-2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.snip mark{background:var(--hl);color:inherit;border-radius:2px}
.tagpill{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent-text);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer}
.tagpill small{opacity:.7}
.empty{color:var(--muted);padding:14px 10px;font-size:13px}
.resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
.resizer:hover{background:var(--accent-soft)}
/* main */
#main{display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
#tabs{display:flex;gap:2px;padding:8px 10px 0;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:9px 9px 0 0;color:var(--muted);max-width:200px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--bg3)}
.tab.on{background:var(--bg);color:var(--text);box-shadow:0 1px 0 var(--bg),inset 0 2px 0 var(--accent)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:.5}
.tab .x:hover{background:var(--bg3);opacity:1}.tab .x svg{width:12px;height:12px}
#tabs .plus{margin-left:4px;align-self:center}
#bar{display:flex;align-items:center;gap:4px;padding:6px 14px;color:var(--muted);flex:none}
#crumb{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroller{flex:1;overflow:auto;position:relative}
#page{max-width:760px;margin:0 auto;padding:28px 40px 30vh}
#title{width:100%;border:0;background:none;outline:0;font:700 2.1em/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 14px;padding:0}
#edwrap{position:relative}
#hl,#ta{font:15.5px/1.75 var(--sans);padding:0;margin:0;border:0;white-space:pre-wrap;word-wrap:break-word;tab-size:4;width:100%;letter-spacing:0}
#hl{position:absolute;inset:0;pointer-events:none;color:var(--text)}
#ta{position:relative;display:block;resize:none;outline:0;background:transparent;color:transparent;caret-color:var(--accent);overflow:hidden;min-height:60vh}
#ta::selection{background:var(--accent-soft);color:transparent}
.s-h{color:var(--accent-text);font-weight:600}.s-m{color:var(--faint)}
.s-code{color:#d6568a;font-family:var(--mono);font-size:.93em;background:var(--code-bg);border-radius:4px}
.s-link{color:var(--accent-text)}.s-b{font-weight:600}.s-i{font-style:italic}.s-hl{background:var(--hl)}
.s-tag{color:var(--accent-text);background:var(--accent-soft);border-radius:4px}.s-q{color:var(--muted)}.s-s{text-decoration:line-through;color:var(--muted)}
:root[data-theme=dark] .s-code{color:#ff8fb8}
/* reading */
.md{font:16px/1.75 var(--serif)}
body.sans .md{font-family:var(--sans);font-size:15.5px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--sans);letter-spacing:-.01em;line-height:1.25;margin:1.6em 0 .5em}
.md h1{font-size:1.9em}.md h2{font-size:1.5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}.md h3{font-size:1.25em}.md h4{font-size:1.1em}.md h5,.md h6{font-size:1em;color:var(--muted)}
.md p{margin:.7em 0}
.md a{color:var(--accent-text);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.md a:hover{border-color:var(--accent)}
.md a.wl.ghost{opacity:.6;border-bottom-style:dashed}
.md code{font:.88em var(--mono);background:var(--code-bg);padding:.15em .4em;border-radius:5px}
.md pre{background:var(--code-bg);padding:14px 16px;border-radius:11px;overflow:auto;position:relative;border:1px solid var(--line)}
.md pre code{background:none;padding:0}
.md blockquote{margin:1em 0;padding:.1em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
.md img{max-width:100%;border-radius:10px}
.md ul,.md ol{padding-left:1.5em;margin:.5em 0}
.md li{margin:.2em 0}.md li.task{list-style:none;margin-left:-1.3em}
.md li.task input{margin-right:.55em;accent-color:var(--accent);transform:scale(1.1);cursor:pointer}
.md li.done>.tx{color:var(--muted);text-decoration:line-through}
.md table{border-collapse:collapse;margin:1em 0;font-family:var(--sans);font-size:.93em}
.md th,.md td{border:1px solid var(--line);padding:6px 12px}.md th{background:var(--bg2);text-align:left}
.md .tag{color:var(--accent-text);background:var(--accent-soft);padding:.05em .55em;border-radius:99px;font:500 .85em var(--sans);cursor:pointer}
.callout{border-radius:11px;padding:12px 16px;margin:1em 0;background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);font-family:var(--sans)}
.callout .ct{font-weight:600;color:var(--c);display:flex;gap:8px;align-items:center}
.callout .cb>:first-child{margin-top:.4em}.callout .cb>:last-child{margin-bottom:0}
.fm{font:12.5px var(--mono);color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
/* right */
#right{background:var(--bg2);border-left:1px solid var(--line);overflow:auto;display:none;flex-direction:column}
body.right #right{display:flex}
.sec{padding:12px 12px 4px}.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bl{padding:6px 8px;border-radius:8px;cursor:pointer}.bl:hover{background:var(--bg3)}
.bl b{display:block;font-weight:550}.bl small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol{padding:3px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}.ol:hover{background:var(--bg3);color:var(--text)}
/* status */
#status{white-space:nowrap;display:flex;justify-content:flex-end;gap:14px;padding:5px 16px;color:var(--faint);font-size:12px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
/* overlays */
#modal{position:fixed;inset:0;background:rgba(10,8,25,.35);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:50}
#modal.on{display:flex}
#box{width:min(620px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
#q{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;background:none;padding:16px 18px;font-size:16px}
#res{max-height:50vh;overflow:auto;padding:6px}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
.it.on{background:var(--accent-soft);color:var(--accent-text)}
.it small{margin-left:auto;color:var(--muted)}
.hint{padding:8px 16px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;gap:14px}
kbd{font:11px var(--mono);background:var(--bg3);border-radius:5px;padding:1px 6px;color:var(--muted)}
#ac{position:fixed;display:none;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:4px;z-index:40;min-width:200px;max-height:240px;overflow:auto}
#graphv{position:absolute;inset:0;background:var(--bg);display:none;z-index:10}
#graphv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#app{grid-template-rows:minmax(0,100%)}#main,#side,#right{min-height:0;overflow:hidden}#right{overflow:auto}
#graphv .gh{position:absolute;top:14px;left:18px;color:var(--muted);font-size:12px;pointer-events:none}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
body.drag #main::after{content:'Drop to add to your vault';position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-text);font-weight:600;font-size:18px;z-index:30;pointer-events:none}
#page.wide{max-width:1040px}
.md img.emb,.fb img{display:block;margin:.8em 0;max-width:100%;border:1px solid var(--line)}
.md embed.pdf,.fb embed.pdf{width:100%;height:80vh;border:1px solid var(--line);border-radius:10px;background:#fff;margin:.8em 0;display:block}
.md video,.fb video{max-width:100%;border-radius:10px;display:block;margin:.8em 0}.md audio,.fb audio{width:100%;margin:.6em 0}
.filechip{display:inline-flex;gap:6px;align-items:center;background:var(--bg2);border:1px solid var(--line)!important;border-radius:9px;padding:3px 11px;font:500 .9em var(--sans)}
.canva{display:flex;flex-direction:column;gap:2px;padding:14px 18px;margin:.9em 0;border-radius:13px;font-family:var(--sans);color:#fff;background:linear-gradient(135deg,#00c4cc,#7d2ae8)}
.canva b{font-size:1.05em}.canva span,.canva a{color:#fff;font-size:.9em;opacity:.92;border:0;text-decoration:underline}
.fv{padding-top:6px}.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.fh h2{margin:0;font-size:1.6em;letter-spacing:-.02em;word-break:break-all}.fh small{color:var(--muted)}
.fa{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 13px;font-size:13px;color:var(--text);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--bg3)}.btn.danger:hover{background:#e5484d;color:#fff;border-color:#e5484d}
@media(max-width:800px){#app{grid-template-columns:48px 0 1fr 0}#side{display:none}#page{padding:20px 18px 30vh}}
</style>
</head>
<body>
<div id="app">
  <nav id="ribbon">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l7 9-7 9-7-9z"/></svg></div>
    <button class="ib on" data-v="files" title="Files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="ib" data-v="search" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="ib" data-v="tags" title="Tags"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg></button>
    <button class="ib" id="bGraph" title="Graph view (⌘G)"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 1M7 8l4 8M17 10l-4 6"/></svg></button>
    <button class="ib" id="bDaily" title="Today's note"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <div class="sp"></div>
    <button class="ib" id="bRight" title="Backlinks & outline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg></button>
    <button class="ib" id="bTheme" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="ib" id="bCmd" title="Command palette (⌘P)"><svg viewBox="0 0 24 24"><path d="M5 8l5 4-5 4M13 17h6"/></svg></button>
  </nav>
  <aside id="side">
    <div class="side-head"><h3 id="sideTitle">Files</h3>
      <button class="ib" id="bNew" title="New note (⌘N)" style="width:28px;height:28px"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="bFold" title="New folder" style="width:28px;height:28px"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></svg></button>
    </div>
    <div class="side-body" id="sideBody"></div>
    <div class="resizer" id="resizer"></div>
  </aside>
  <main id="main">
    <div id="tabs"></div>
    <div id="bar">
      <div id="crumb"></div>
      <button class="ib" id="bMode" title="Toggle edit / reading (⌘E)"></button>
    </div>
    <div id="scroller"><div id="page"></div></div>
    <div id="graphv"><canvas></canvas><div class="gh">Drag nodes · scroll to zoom · click to open · Esc to close</div></div>
    <div id="status"><span id="vaultPath" style="margin-right:auto;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="Vault folder on disk"></span><span id="stLinks"></span><span id="stWords"></span><span id="stSaved">Saved</span></div>
  </main>
  <aside id="right"></aside>
</div>
<div id="modal"><div id="box"><input id="q" autocomplete="off" spellcheck="false"><div id="res"></div><div class="hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div></div></div>
<div id="ac"></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ICON={
  file:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M2 5.5C2 4.7 2.7 4 3.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H3.5A1.5 1.5 0 0 1 2 16.5zM22 5.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};
/* ---------- store ---------- */
let S;
const UI_KEYS=['tabs','active','theme','collapsed','side','right','mode','sans','sideW'];
async function api(method,url,data){
  const r=await fetch(url,{method,headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
const q_=p=>'/api/note?p='+encodeURIComponent(p);
let snap={},snapF=[],srvT={};   // what the server is known to hold
async function load(){
  const [v,st]=await Promise.all([api('GET','/api/vault'),api('GET','/api/state')]);
  S={tabs:[],active:null,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',collapsed:{},side:'files',right:false,mode:'edit',...st,notes:v.notes,folders:v.folders,files:v.files||{}};
  for(const p in v.notes){snap[p]=v.notes[p].c;srvT[p]=v.notes[p].t}
  snapF=[...v.folders];
  $('#vaultPath').textContent=v.vault;
  if(!Object.keys(S.notes).length&&!S.folders.length&&!st.seeded){seed();S.seeded=true}
}
let saveT,flushing=false,again=false;
function save(){clearTimeout(saveT);$('#stSaved').textContent='Saving…';saveT=setTimeout(flush,250)}
// Diff in-memory vault against what the server holds and push only the changes.
async function flush(){
  if(flushing){again=true;return}
  flushing=true;
  try{
    for(const p of Object.keys(snap))if(!S.notes[p]){await api('DELETE',q_(p));delete snap[p];delete srvT[p]}
    const jobs=[];
    for(const f of S.folders)if(!snapF.includes(f))jobs.push(api('POST','/api/folder',{p:f}).then(()=>snapF.push(f)));

function autocomplete(){
  const pos=ta.selectionStart,before=ta.value.slice(0,pos),m=before.match(/\[\[([^\]\n]*)$/),ac=$('#ac');
  if(!m){ac.style.display='none';acState=null;return}

function acPick(i){
  const p=acState.list[i],raw=p[0]==='\u0001'?p.slice(1):p[0]==='\u0002'?name(p.slice(1)):name(p);
  const v=ta.value,end=ta.selectionStart,after=v.slice(end).startsWith(']]')?2:0;

function wrap(a,b=a){

  graph.nodes=[...ids].map(id=>old[id]||{id,x:(Math.random()-.5)*300,y:(Math.random()-.5)*300,vx:0,vy:0});
  graph.edges=[];for(const p in idx.links)idx.links[p].forEach(t=>graph.edges.push([p,t]));
  const deg={};graph.edges.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1});graph.nodes.forEach(n=>n.d=deg[n.id]||0);
  const m=Object.fromEntries(graph.nodes.map(n=>[n.id,n]));graph.edges=graph.edges.map(([a,b])=>[m[a],m[b]]);
  graph.zoom=1;graph.ox=r.width/2;graph.oy=r.height/2;graph.alpha=1;
  cancelAnimationFrame(graph.raf);const loop=()=>{if(!graph.on)return;sim();drawGraph();graph.raf=requestAnimationFrame(loop)};loop();
}
function closeGraph(){graph.on=false;$('#graphv').style.display='none';cancelAnimationFrame(graph.raf)}
function sim(){
  const N=graph.nodes,a=graph.alpha;if(a<.003&&!graph.drag)return;
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    let dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=2600/d2;
    dx/=d;dy/=d;N[i].vx+=dx*f;N[i].vy+=dy*f;N[j].vx-=dx*f;N[j].vy-=dy*f}
  graph.edges.forEach(([s,t])=>{const dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1,f=(d-90)*.02;s.vx+=dx/d*f;s.vy+=dy/d*f;t.vx-=dx/d*f;t.vy-=dy/d*f});
  N.forEach(n=>{n.vx-=n.x*.004;n.vy-=n.y*.004;if(n!==graph.drag){n.x+=n.vx*a*.6;n.y+=n.vy*a*.6}n.vx*=.82;n.vy*=.82});
  graph.alpha*=.995;
}
function drawGraph(){
  const cv=$('#graphv canvas'),c=cv.getContext('2d'),dpr=devicePixelRatio||1,cs=getComputedStyle(document.documentElement);
  const col=v=>cs.getPropertyValue(v).trim();
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,cv.width,cv.height);
  c.translate(graph.ox,graph.oy);c.scale(graph.zoom,graph.zoom);
  const hv=graph.hover,nb=new Set();if(hv)graph.edges.forEach(([a,b])=>{if(a===hv)nb.add(b);if(b===hv)nb.add(a)});
  graph.edges.forEach(([a,b])=>{const hot=hv&&(a===hv||b===hv);c.strokeStyle=hot?col('--accent'):col('--line');c.globalAlpha=hv&&!hot?.25:1;c.lineWidth=hot?1.6:1;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()});
  graph.nodes.forEach(n=>{
    const ghost=!S.notes[n.id],r=4+Math.min(n.d,10)*1.1,act=n.id===S.active,dim=hv&&n!==hv&&!nb.has(n);
    c.globalAlpha=dim?.25:1;c.beginPath();c.arc(n.x,n.y,r,0,7);
    c.fillStyle=act||n===hv?col('--accent'):ghost?col('--faint'):col('--muted');c.fill();
    if(act){c.strokeStyle=col('--accent');c.globalAlpha=.35;c.lineWidth=5;c.stroke()}
    if(graph.zoom>.7||n===hv||nb.has(n)){c.globalAlpha=dim?.2:.9;c.fillStyle=col('--text');c.font='12px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';c.fillText(ghost?n.id.slice(1):name(n.id),n.x,n.y+r+14)}
  });
  c.globalAlpha=1;
}
(()=>{
  const cv=$('#graphv canvas');
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-graph.ox)/graph.zoom,y:(e.clientY-r.top-graph.oy)/graph.zoom}};
  const hit=e=>{const p=pt(e);return graph.nodes.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<8+Math.min(n.d,10))};
  let pan=null,moved=false;
  cv.addEventListener('mousedown',e=>{moved=false;const n=hit(e);if(n){graph.drag=n;graph.alpha=.6}else pan={x:e.clientX,y:e.clientY,ox:graph.ox,oy:graph.oy}});
  addEventListener('mousemove',e=>{
    if(!graph.on)return;
    if(graph.drag){moved=true;const p=pt(e);graph.drag.x=p.x;graph.drag.y=p.y;graph.alpha=.6}
    else if(pan){moved=true;graph.ox=pan.ox+e.clientX-pan.x;graph.oy=pan.oy+e.clientY-pan.y}
    else{const n=hit(e);graph.hover=n||null;cv.style.cursor=n?'pointer':'grab'}});
  addEventListener('mouseup',()=>{if(graph.drag&&!moved){const id=graph.drag.id;graph.drag=null;if(S.notes[id])openNote(id);else followLink(id.slice(1));return}graph.drag=null;pan=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.exp(-e.deltaY*.0015),nz=Math.min(4,Math.max(.2,graph.zoom*k));
    graph.ox=mx-(mx-graph.ox)*nz/graph.zoom;graph.oy=my-(my-graph.oy)*nz/graph.zoom;graph.zoom=nz},{passive:false});
})();
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-delf]')){e.stopPropagation();return deleteFile(el.dataset.delf)}
  if(el=t.closest('[data-copy]')){navigator.clipboard?.writeText(el.dataset.copy).then(()=>toast('Copied'),()=>{});return}
  if(el=t.closest('[data-file]')){e.preventDefault();return openFile(el.dataset.file)}
  if(el=t.closest('[data-del]')){e.stopPropagation();return deleteNote(el.dataset.del)}
  if(el=t.closest('[data-newin]')){e.stopPropagation();return newNote(el.dataset.newin)}
  if(el=t.closest('[data-folder]')){const f=el.dataset.folder;S.collapsed[f]=!S.collapsed[f];renderSide();return save()}
  if(el=t.closest('[data-close]')){e.stopPropagation();return closeTab(el.dataset.close)}
  if(el=t.closest('[data-tab]')){S.active=el.dataset.tab;closeGraph();renderAll();return save()}
  if(el=t.closest('[data-note]'))return openNote(el.dataset.note);
  if(el=t.closest('[data-ghost]'))return followLink(el.dataset.ghost);
  if(el=t.closest('a.wl')){e.preventDefault();return followLink(el.dataset.link)}
  if(el=t.closest('[data-tag]')){S.side='search';query='#'+el.dataset.tag;renderSide();return}
  if(el=t.closest('[data-line]')){
    const ln=+el.dataset.line;
    if(editing){const lines=ta.value.split('\n');let pos=0;for(let i=0;i<ln;i++)pos+=lines[i].length+1;ta.focus();ta.setSelectionRange(pos,pos+lines[ln].length);const y=caretXY(pos).y;$('#scroller').scrollBy({top:y-200,behavior:'smooth'})}
    else{const h=$('#h-'+ln);if(h)h.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(t.id==='tPlus')return newNote();
  if(t.closest('#eN'))return newNote();
  if(t.closest('#eO'))return openPalette('open');
  if(el=t.closest('#ribbon [data-v]')){S.side=el.dataset.v;renderSide();return save()}
});
document.addEventListener('change',e=>{
  const c=e.target.closest('input[data-ln]');if(!c)return;
  const L=S.notes[S.active].c.split('\n'),i=+c.dataset.ln;
  L[i]=L[i].replace(/\[( |x|X)\]/,c.checked?'[x]':'[ ]');S.notes[S.active].c=L.join('\n');S.notes[S.active].t=Date.now();
  c.closest('li').classList.toggle('done',c.checked);save();
});
$('#bNew').onclick=()=>newNote();$('#bFold').onclick=newFolder;$('#bGraph').onclick=()=>graph.on?closeGraph():openGraph();
$('#bDaily').onclick=dailyNote;$('#bTheme').onclick=toggleTheme;$('#bCmd').onclick=()=>openPalette('cmd');$('#bMode').onclick=toggleMode;
$('#bRight').onclick=()=>{S.right=!S.right;renderRight();save()};
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(e.key==='Escape'){if(graph.on)closeGraph();if($('#modal').classList.contains('on'))closePal();return}
  if(!mod)return;
  const m={p:()=>openPalette('cmd'),o:()=>openPalette('open'),n:()=>newNote(),g:()=>graph.on?closeGraph():openGraph(),e:toggleMode,'/':()=>{S.right=!S.right;renderRight();save()},w:()=>S.active&&closeTab(S.active),
    f:()=>{if(e.shiftKey){S.side='search';renderSide()}else return false}};
  if(e.shiftKey&&k==='f'){e.preventDefault();S.side='search';renderSide();return}
  if(m[k]&&!(k==='w'&&!e.altKey&&false)){const r=m[k]();if(r!==false)e.preventDefault()}
});
(()=>{ // sidebar resize
  const r=$('#resizer');let down=false;
  r.onmousedown=e=>{down=true;e.preventDefault()};
  addEventListener('mousemove',e=>{if(down)document.documentElement.style.setProperty('--side',Math.min(520,Math.max(200,e.clientX-48))+'px')});
  addEventListener('mouseup',()=>{if(down){down=false;try{S.sideW=getComputedStyle(document.documentElement).getPropertyValue('--side');save()}catch(e){}}});
})();
addEventListener('resize',()=>{if(editing&&S.active)autosize()});
addEventListener('beforeunload',e=>{if(saveT&&$('#stSaved').textContent!=='Saved'){flush();e.preventDefault()}});
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('drag')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{document.body.classList.remove('drag');if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();ingest(e.dataTransfer.files,true)}});
ta.addEventListener('paste',e=>{
  const fs=[...(e.clipboardData?.files||[])];if(!fs.length)return;e.preventDefault();
  const d=new Date(),st=d.toISOString().slice(0,19).replace('T',' ').replace(/:/g,'.');
  ingest(fs.map(f=>/^image\.\w+$/i.test(f.name)?new File([f],`Pasted image ${st}.${f.type.split('/')[1]||'png'}`,{type:f.type}):f),true);
});
/* ---------- boot ---------- */
(async()=>{
  try{await load()}catch(e){document.body.innerHTML='<div style="padding:40px;font:16px sans-serif">Can’t reach the Lumen server. Start it with <code>node server.js</code>.</div>';return}
  applyTheme();
  if(S.sans)document.body.classList.add('sans');
  if(S.sideW)document.documentElement.style.setProperty('--side',S.sideW);
  editing=S.mode!=='read';
  const okTab=p=>isFile(p)?S.files[fpath(p)]:S.notes[p];S.tabs=S.tabs.filter(okTab);if(!okTab(S.active))S.active=S.tabs[0]||null;
  reindex();renderSide.noFocus=true;renderAll();renderSide.noFocus=false;
  if(S.seeded&&Object.keys(snap).length===0)save();
  setInterval(pull,3000);
})();
</script>
